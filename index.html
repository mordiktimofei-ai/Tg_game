<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TicTacBet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0F0F0F;
      --card: #1C1C1E;
      --accent: #2AABEE;
      --text: #FFFFFF;
      --text-secondary: #8E8E93;
      --success: #34C759;
      --danger: #FF3B30;
      --warning: #FFCC00;
      --radius: 12px;
      --radius-lg: 16px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: screenIn 0.3s ease;
    }
    .screen.active { display: flex; }
    @keyframes screenIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      overflow: hidden;
      user-select: none;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #1E90FF);
      color: white;
      box-shadow: 0 4px 16px rgba(42, 171, 238, 0.3);
    }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 2px solid rgba(255, 59, 48, 0.3);
    }
    .btn-ghost {
      background: transparent;
      color: var(--accent);
      padding: 8px 16px;
    }
    .btn-large {
      width: 100%;
      padding: 20px;
      font-size: 18px;
      border-radius: var(--radius-lg);
    }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .text-center { text-align: center; }
    .text-secondary { color: var(--text-secondary); }
    .font-bold { font-weight: 700; }
    .scrollable {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 80px;
      -webkit-overflow-scrolling: touch;
    }
    .scrollable::-webkit-scrollbar { display: none; }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card);
      color: var(--text);
      padding: 12px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error { border-color: var(--danger); }
    .toast.success { border-color: var(--success); }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 500;
      backdrop-filter: blur(10px);
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 320px;
      border: 1px solid rgba(255,255,255,0.1);
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .game-cell {
      background: var(--card);
      border-radius: 16px;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .game-cell:hover:not(.taken) { border-color: rgba(42,171,238,0.3); }
    .game-cell.taken { cursor: default; }
    .game-cell.x { color: var(--accent); text-shadow: 0 0 20px rgba(42,171,238,0.5); animation: placeMark 0.3s ease; }
    .game-cell.o { color: var(--danger); text-shadow: 0 0 20px rgba(255,59,48,0.5); animation: placeMark 0.3s ease; }
    @keyframes placeMark {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes orbit-spin {
      from { transform: translate(-50%,-50%) rotate(0deg); }
      to { transform: translate(-50%,-50%) rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes glowPulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%,-50%) scale(1.2); opacity: 0.15; }
    }
    @keyframes emojiBounce {
      0% { transform: scale(0) rotate(-20deg); }
      60% { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes amountSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes cellAppear {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes statSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes btnSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    @keyframes winPulse {
      from { box-shadow: 0 0 0 0 rgba(52,199,89,0.4); }
      to { box-shadow: 0 0 20px 5px rgba(52,199,89,0); }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div id="modals"></div>
  <div id="screens"></div>

  <script>
    // ===== APP CORE =====
    const App = {
      tg: {
        ready: () => {}, expand: () => {}, enableClosingConfirmation: () => {},
        BackButton: { show: () => {}, hide: () => {}, onClick: () => {} },
        openTelegramLink: (url) => window.open(url, '_blank'),
        showPopup: ({title, message}) => alert(title + '\n' + message),
        initData: ''
      },
      screens: {}, currentScreen: null, user: null, token: null,
      ws: null, game: null, history: [],

      init() {
        this.token = localStorage.getItem('token');
        this.user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!this.token) { this.navigate('splash'); }
        else { this.navigate('dashboard'); }
      },

      register(name, renderFn) { this.screens[name] = renderFn; },

      navigate(name, params = {}) {
        if (this.currentScreen) {
          const el = document.getElementById(`screen-${this.currentScreen}`);
          if (el) el.classList.remove('active');
        }
        let screenEl = document.getElementById(`screen-${name}`);
        if (!screenEl) {
          screenEl = document.createElement('div');
          screenEl.id = `screen-${name}`;
          screenEl.className = 'screen';
          document.getElementById('screens').appendChild(screenEl);
          if (this.screens[name]) {
            screenEl.innerHTML = this.screens[name](params);
            this.attachEvents(screenEl, name, params);
          }
        }
        screenEl.classList.add('active');
        this.currentScreen = name;
        this.history.push({ name, params });
      },

      attachEvents(container, screenName, params) {
        container.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const action = btn.dataset.action;
            const handler = this.actions[action];
            if (handler) handler(btn, e, params);
          });
        });
        if (this.screenEvents[screenName]) {
          this.screenEvents[screenName](container, params);
        }
      },

      actions: {
        navigate(btn) { App.navigate(btn.dataset.target); },
        login() {
          const demoUser = { id: 12345, username: 'demo_user' };
          const demoToken = 'demo_token_' + Date.now();
          App.token = demoToken;
          App.user = demoUser;
          localStorage.setItem('token', demoToken);
          localStorage.setItem('user', JSON.stringify(demoUser));
          App.navigate('dashboard');
        },
        selectStake(btn) {
          const stake = parseFloat(btn.dataset.stake);
          App.navigate('queue', { stake });
        },
        cancelQueue() { App.navigate('dashboard'); },
        makeMove(btn) {
          const index = parseInt(btn.dataset.index);
          if (App.game) App.game.makeMove(index);
        },
        surrender() {
          App.showModal('Сдаться?', 'Вы потеряете ставку. Соперник победит.',
            [{ text: 'Играть дальше', action: 'close' }, { text: 'Сдаться', action: 'confirmSurrender', danger: true }]);
        },
        confirmSurrender() {
          if (App.game) App.game.surrender();
          App.closeModal();
        },
        playAgain() { App.navigate('stake'); },
        goDashboard() { App.navigate('dashboard'); },
        share() {
          const text = 'Играю в TicTacBet!';
          navigator.clipboard?.writeText(text);
          App.showToast('Ссылка скопирована!');
        },
        toggleChat() { document.getElementById('chat-panel')?.classList.toggle('active'); },
        closeChat() { document.getElementById('chat-panel')?.classList.remove('active'); },
        sendChat(btn) {
          const msg = btn.dataset.message;
          App.showToast(`${App.user?.username}: ${msg}`);
          document.getElementById('chat-panel')?.classList.remove('active');
        },
        showRules() {
          App.showModal('📋 Правила', '• Ходите по очереди\n• 15 сек на ход\n• 3 в ряд = победа\n• Ничья = возврат ставок');
        },
        deposit() { App.showToast('Пополнение скоро будет доступно'); App.closeModal(); },
        closeModal() { App.closeModal(); },
        requestRevenge() { App.showToast('Реванш запрошен!'); App.navigate('stake'); }
      },

      screenEvents: {},

      showToast(msg, type = 'info') {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = `toast ${type} show`;
        setTimeout(() => toast.classList.remove('show'), 3000);
      },

      showModal(title, text, buttons = []) {
        const container = document.getElementById('modals');
        const modalId = 'modal-' + Date.now();
        const btnHtml = buttons.map((b, i) => `
          <button class="btn ${b.danger ? 'btn-danger' : i === 0 ? 'btn-secondary' : 'btn-primary'}" 
                  style="flex:1;justify-content:center;" data-modal-action="${b.action}" ${b.target ? 'data-target="' + b.target + '"' : ''}>${b.text}</button>
        `).join('');
        container.innerHTML = `
          <div class="modal-overlay active" id="${modalId}">
            <div class="modal-box">
              <div style="font-size:18px;font-weight:700;margin-bottom:8px;">${title}</div>
              <div style="color:var(--text-secondary);font-size:14px;margin-bottom:20px;line-height:1.5;">${text.replace(/\n/g, '<br>')}</div>
              <div style="display:flex;gap:10px;">${btnHtml}</div>
            </div>
          </div>
        `;
        container.querySelectorAll('[data-modal-action]').forEach(btn => {
          btn.onclick = () => {
            const action = btn.dataset.modalAction;
            if (action === 'close') { document.getElementById(modalId)?.remove(); }
            else if (action === 'navigate') { document.getElementById(modalId)?.remove(); App.navigate(btn.dataset.target); }
            else if (App.actions[action]) { App.actions[action](); }
          };
        });
      },

      closeModal() { document.querySelector('.modal-overlay')?.remove(); }
    };

    // ===== SCREEN 1: SPLASH =====
    App.register('splash', () => `
      <div class="flex flex-col items-center justify-center" style="height:100%;padding:24px;text-align:center;">
        <div style="display:grid;grid-template-columns:repeat(3,48px);gap:8px;margin-bottom:24px;">
          ${['O','X','O','X','O','X','O','X',''].map(c => `
            <div style="width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;
              background:${c==='X'?'rgba(42,171,238,0.2)':c==='O'?'rgba(255,59,48,0.2)':'var(--card)'};
              color:${c==='X'?'var(--accent)':c==='O'?'var(--danger)':'transparent'};">${c}</div>
          `).join('')}
        </div>
        <h1 style="font-size:32px;font-weight:800;margin-bottom:8px;">TicTacBet</h1>
        <p style="color:var(--text-secondary);margin-bottom:48px;">PvP Crypto Battles</p>
        <button class="btn btn-primary btn-large" data-action="login" style="margin-bottom:32px;">Войти через Telegram</button>
        <div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;">
          ${[['🛡','Skill-based PvP'],['⚡','Мгновенные выплаты'],['💰','Ставки от $0.5']]
            .map(([i,t]) => `<div style="display:flex;align-items:center;gap:12px;color:var(--text-secondary);font-size:14px;">
              <div style="width:32px;height:32px;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px;">${i}</div><span>${t}</span></div>`).join('')}
        </div>
      </div>
    `);

    // ===== SCREEN 2: DASHBOARD =====
    App.register('dashboard', () => `
      <div style="display:flex;flex-direction:column;height:100%;">
        <div style="padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.05);">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1E90FF);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;">
              ${App.user?.username?.[0]?.toUpperCase() || 'U'}</div>
            <span style="font-size:15px;font-weight:600;">@${App.user?.username || 'user'}</span>
          </div>
          <button class="btn btn-ghost" style="width:36px;height:36px;padding:0;border-radius:10px;background:var(--card);">⚙️</button>
        </div>
        <div style="padding:16px;display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-size:28px;font-weight:700;" id="tonBalance">10.00 TON</div>
            <div style="font-size:14px;color:var(--text-secondary);" id="usdBalance">~$42.00</div>
          </div>
          <button class="btn btn-primary" style="padding:10px 20px;background:rgba(42,171,238,0.15);color:var(--accent);border:1px solid rgba(42,171,238,0.3);font-size:14px;"
            data-action="deposit">+ Пополнить</button>
        </div>
        <div class="scrollable">
          <div style="background:linear-gradient(135deg,#FF6B35,#F7931E);border-radius:16px;padding:20px;margin-bottom:20px;">
            <div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:0.9;margin-bottom:8px;">🔥 Freeroll</div>
            <div style="font-size:24px;font-weight:700;margin-bottom:8px;" id="freerollTimer">02:00:00</div>
            <div style="font-size:14px;opacity:0.9;margin-bottom:16px;">Приз: 50 TON</div>
            <button class="btn" style="width:100%;padding:12px;background:white;color:#FF6B35;border:none;border-radius:10px;font-size:15px;font-weight:700;"
              data-action="navigate" data-target="tournaments">Участвовать</button>
          </div>
          <button class="btn btn-primary btn-large" data-action="navigate" data-target="stake" style="margin-bottom:20px;box-shadow:0 8px 32px rgba(42,171,238,0.3);">
            <span>🔥</span><span>Играть PvP</span>
          </button>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">
            ${[['🎮','Игр','games',0],['🏆','Побед','wins',0],['📊','Винрейт','winrate','0%'],['🔥','Стрик','streak',0]]
              .map(([i,l,k,v]) => `<div style="background:var(--card);border-radius:12px;padding:16px;text-align:center;">
                <div style="font-size:24px;margin-bottom:8px;">${i}</div>
                <div style="font-size:22px;font-weight:700;margin-bottom:4px;" id="stat-${k}">${v}</div>
                <div style="font-size:12px;color:var(--text-secondary);">${l}</div></div>`).join('')}
          </div>
          <div style="text-align:center;padding:12px;color:var(--text-secondary);font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;">
            <div style="width:8px;height:8px;background:var(--success);border-radius:50%;animation:pulse 2s infinite;"></div>
            <span>Онлайн: <strong>1</strong></span>
          </div>
        </div>
        <div style="position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,15,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));">
          ${[['🏠','Главная','dashboard',true],['🎮','Играть','stake',false],['👤','Профиль','profile',false]]
            .map(([i,l,t,a]) => `<button class="btn btn-ghost" style="flex:1;flex-direction:column;gap:4px;padding:8px;font-size:11px;color:${a?'var(--accent)':'var(--text-secondary)'};"
              data-action="navigate" data-target="${t}"><span style="font-size:24px;line-height:1;">${i}</span><span>${l}</span></button>`).join('')}
        </div>
      </div>
    `);

    // ===== SCREEN 3: STAKE SELECT =====
    const STAKES = [{ton:0.5,usd:2.1,p:false},{ton:1,usd:4.2,p:true},{ton:2,usd:8.4,p:false},{ton:5,usd:21,p:false}];

    App.register('stake', () => `
      <div style="display:flex;flex-direction:column;height:100%;">
        <div style="padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.05);">
          <button class="btn btn-secondary" style="width:36px;height:36px;padding:0;" data-action="navigate" data-target="dashboard">←</button>
          <span style="font-size:17px;font-weight:600;">Выбор ставки</span>
        </div>
        <div class="scrollable" style="padding-top:20px;">
          <h2 style="font-size:22px;font-weight:700;margin-bottom:20px;text-align:center;">Выберите размер ставки</h2>
          <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px;" id="stakeList">
            ${STAKES.map(s => `
              <div class="stake-card" data-stake="${s.ton}" data-action="selectStake" data-stake-value="${s.ton}"
                style="background:var(--card);border-radius:16px;padding:20px;display:flex;justify-content:space-between;align-items:center;border:2px solid transparent;cursor:pointer;transition:all 0.15s;">
                <div>
                  <h3 style="font-size:20px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;">
                    💎       position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: screenIn 0.3s ease;
    }

    .screen.active { display: flex; }

    @keyframes screenIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ===== BUTTONS ===== */
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      overflow: hidden;
      user-select: none;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #1E90FF);
      color: white;
      box-shadow: 0 4px 16px rgba(42, 171, 238, 0.3);
    }

    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 2px solid rgba(255, 59, 48, 0.3);
    }

    .btn-ghost {
      background: transparent;
      color: var(--accent);
      padding: 8px 16px;
    }

    .btn-large {
      width: 100%;
      padding: 20px;
      font-size: 18px;
      border-radius: var(--radius-lg);
    }

    /* ===== UTILS ===== */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .text-center { text-align: center; }
    .text-secondary { color: var(--text-secondary); }
    .font-bold { font-weight: 700; }

    .scrollable {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 80px;
      -webkit-overflow-scrolling: touch;
    }

    .scrollable::-webkit-scrollbar { display: none; }

    /* Loading */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card);
      color: var(--text);
      padding: 12px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error { border-color: var(--danger); }
    .toast.success { border-color: var(--success); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 500;
      backdrop-filter: blur(10px);
    }

    .modal-overlay.active { display: flex; }

    .modal-box {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 320px;
      border: 1px solid rgba(255,255,255,0.1);
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Game board */
    .game-cell {
      background: var(--card);
      border-radius: 16px;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .game-cell:hover:not(.taken) { border-color: rgba(42,171,238,0.3); }
    .game-cell.taken { cursor: default; }
    .game-cell.x { color: var(--accent); text-shadow: 0 0 20px rgba(42,171,238,0.5); animation: placeMark 0.3s ease; }
    .game-cell.o { color: var(--danger); text-shadow: 0 0 20px rgba(255,59,48,0.5); animation: placeMark 0.3s ease; }

    @keyframes placeMark {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Animations */
    @keyframes orbit-spin {
      from { transform: translate(-50%,-50%) rotate(0deg); }
      to { transform: translate(-50%,-50%) rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes glowPulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%,-50%) scale(1.2); opacity: 0.15; }
    }

    @keyframes emojiBounce {
      0% { transform: scale(0) rotate(-20deg); }
      60% { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes amountSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes cellAppear {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes statSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes btnSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    @keyframes winPulse {
      from { box-shadow: 0 0 0 0 rgba(52,199,89,0.4); }
      to { box-shadow: 0 0 20px 5px rgba(52,199,89,0); }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div id="modals"></div>
  <div id="screens"></div>

  <script src="screens.js"></script>
</body>
</html>
