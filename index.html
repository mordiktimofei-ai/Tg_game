<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TicTacBet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    /* ===== BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0F0F0F;
      --card: #1C1C1E;
      --accent: #2AABEE;
      --text: #FFFFFF;
      --text-secondary: #8E8E93;
      --success: #34C759;
      --danger: #FF3B30;
      --warning: #FFCC00;
      --radius: 12px;
      --radius-lg: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== SCREEN SYSTEM ===== */
    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: screenIn 0.3s ease;
    }

    .screen.active { display: flex; }

    @keyframes screenIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ===== BUTTONS ===== */
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      overflow: hidden;
      user-select: none;
    }

    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #1E90FF);
      color: white;
      box-shadow: 0 4px 16px rgba(42, 171, 238, 0.3);
    }

    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 2px solid rgba(255, 59, 48, 0.3);
    }

    .btn-ghost {
      background: transparent;
      color: var(--accent);
      padding: 8px 16px;
    }

    .btn-large {
      width: 100%;
      padding: 20px;
      font-size: 18px;
      border-radius: var(--radius-lg);
    }

    /* ===== UTILS ===== */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .text-center { text-align: center; }
    .text-secondary { color: var(--text-secondary); }
    .font-bold { font-weight: 700; }

    .scrollable {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 80px;
      -webkit-overflow-scrolling: touch;
    }

    .scrollable::-webkit-scrollbar { display: none; }

    /* Loading */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card);
      color: var(--text);
      padding: 12px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error { border-color: var(--danger); }
    .toast.success { border-color: var(--success); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 500;
      backdrop-filter: blur(10px);
    }

    .modal-overlay.active { display: flex; }

    .modal-box {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 320px;
      border: 1px solid rgba(255,255,255,0.1);
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Game board */
    .game-cell {
      background: var(--card);
      border-radius: 16px;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .game-cell:hover:not(.taken) { border-color: rgba(42,171,238,0.3); }
    .game-cell.taken { cursor: default; }
    .game-cell.x { color: var(--accent); text-shadow: 0 0 20px rgba(42,171,238,0.5); animation: placeMark 0.3s ease; }
    .game-cell.o { color: var(--danger); text-shadow: 0 0 20px rgba(255,59,48,0.5); animation: placeMark 0.3s ease; }

    @keyframes placeMark {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Animations */
    @keyframes orbit-spin {
      from { transform: translate(-50%,-50%) rotate(0deg); }
      to { transform: translate(-50%,-50%) rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes glowPulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%,-50%) scale(1.2); opacity: 0.15; }
    }

    @keyframes emojiBounce {
      0% { transform: scale(0) rotate(-20deg); }
      60% { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes amountSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes cellAppear {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes statSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes btnSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    @keyframes winPulse {
      from { box-shadow: 0 0 0 0 rgba(52,199,89,0.4); }
      to { box-shadow: 0 0 20px 5px rgba(52,199,89,0); }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div id="modals"></div>
  <div id="screens"></div>

  <script src="screens.js"></script>
</body>
</html>
