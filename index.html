<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TicTacBet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0F0F0F;
      --card: #1C1C1E;
      --accent: #2AABEE;
      --text: #FFFFFF;
      --text-secondary: #8E8E93;
      --success: #34C759;
      --danger: #FF3B30;
      --warning: #FFCC00;
      --radius: 12px;
      --radius-lg: 16px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: screenIn 0.3s ease;
    }
    .screen.active { display: flex; }
    @keyframes screenIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      overflow: hidden;
      user-select: none;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.4; pointer-events: none; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #1E90FF);
      color: white;
      box-shadow: 0 4px 16px rgba(42, 171, 238, 0.3);
    }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 2px solid rgba(255, 59, 48, 0.3);
    }
    .btn-ghost {
      background: transparent;
      color: var(--accent);
      padding: 8px 16px;
    }
    .btn-large {
      width: 100%;
      padding: 20px;
      font-size: 18px;
      border-radius: var(--radius-lg);
    }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .text-center { text-align: center; }
    .text-secondary { color: var(--text-secondary); }
    .font-bold { font-weight: 700; }
    .scrollable {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 80px;
      -webkit-overflow-scrolling: touch;
    }
    .scrollable::-webkit-scrollbar { display: none; }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--card);
      color: var(--text);
      padding: 12px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error { border-color: var(--danger); }
    .toast.success { border-color: var(--success); }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 500;
      backdrop-filter: blur(10px);
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 320px;
      border: 1px solid rgba(255,255,255,0.1);
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .game-cell {
      background: var(--card);
      border-radius: 16px;
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .game-cell:hover:not(.taken) { border-color: rgba(42,171,238,0.3); }
    .game-cell.taken { cursor: default; }
    .game-cell.x { color: var(--accent); text-shadow: 0 0 20px rgba(42,171,238,0.5); animation: placeMark 0.3s ease; }
    .game-cell.o { color: var(--danger); text-shadow: 0 0 20px rgba(255,59,48,0.5); animation: placeMark 0.3s ease; }
    @keyframes placeMark {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes orbit-spin {
      from { transform: translate(-50%,-50%) rotate(0deg); }
      to { transform: translate(-50%,-50%) rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes glowPulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%,-50%) scale(1.2); opacity: 0.15; }
    }
    @keyframes emojiBounce {
      0% { transform: scale(0) rotate(-20deg); }
      60% { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes amountSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes cellAppear {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes statSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes btnSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    @keyframes winPulse {
      from { box-shadow: 0 0 0 0 rgba(52,199,89,0.4); }
      to { box-shadow: 0 0 20px 5px rgba(52,199,89,0); }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div id="modals"></div>
  <div id="screens"></div>

  <script>
    // ===== APP CORE =====
    const App = {
      tg: {
        ready: () => {}, expand: () => {}, enableClosingConfirmation: () => {},
        BackButton: { show: () => {}, hide: () => {}, onClick: () => {} },
        openTelegramLink: (url) => window.open(url, '_blank'),
        showPopup: ({title, message}) => alert(title + '
' + message),
        initData: ''
      },
      screens: {}, currentScreen: null, user: null, token: null,
      ws: null, game: null, history: [],

      init() {
        this.token = localStorage.getItem('token');
        this.user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!this.token) { this.navigate('splash'); }
        else { this.navigate('dashboard'); }
      },

      register(name, renderFn) { this.screens[name] = renderFn; },

      navigate(name, params = {}) {
        if (this.currentScreen) {
          const el = document.getElementById('screen-' + this.currentScreen);
          if (el) el.classList.remove('active');
        }
        let screenEl = document.getElementById('screen-' + name);
        if (!screenEl) {
          screenEl = document.createElement('div');
          screenEl.id = 'screen-' + name;
          screenEl.className = 'screen';
          document.getElementById('screens').appendChild(screenEl);
          if (this.screens[name]) {
            screenEl.innerHTML = this.screens[name](params);
            this.attachEvents(screenEl, name, params);
          }
        }
        screenEl.classList.add('active');
        this.currentScreen = name;
        this.history.push({ name, params });
      },

      attachEvents(container, screenName, params) {
        container.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const action = btn.dataset.action;
            const handler = this.actions[action];
            if (handler) handler(btn, e, params);
          });
        });
        if (this.screenEvents[screenName]) {
          this.screenEvents[screenName](container, params);
        }
      },

      actions: {
        navigate(btn) { App.navigate(btn.dataset.target); },
        login() {
          const demoUser = { id: 12345, username: 'demo_user' };
          const demoToken = 'demo_token_' + Date.now();
          App.token = demoToken;
          App.user = demoUser;
          localStorage.setItem('token', demoToken);
          localStorage.setItem('user', JSON.stringify(demoUser));
          App.navigate('dashboard');
        },
        selectStake(btn) {
          const stake = parseFloat(btn.dataset.stake);
          App.navigate('queue', { stake });
        },
        cancelQueue() { App.navigate('dashboard'); },
        makeMove(btn) {
          const index = parseInt(btn.dataset.index);
          if (App.game) App.game.makeMove(index);
        },
        surrender() {
          App.showModal('Сдаться?', 'Вы потеряете ставку. Соперник победит.',
            [{ text: 'Играть дальше', action: 'close' }, { text: 'Сдаться', action: 'confirmSurrender', danger: true }]);
        },
        confirmSurrender() {
          if (App.game) App.game.surrender();
          App.closeModal();
        },
        playAgain() { App.navigate('stake'); },
        goDashboard() { App.navigate('dashboard'); },
        share() {
          const text = 'Играю в TicTacBet!';
          navigator.clipboard?.writeText(text);
          App.showToast('Ссылка скопирована!');
        },
        toggleChat() { document.getElementById('chat-panel').classList.toggle('active'); },
        closeChat() { document.getElementById('chat-panel').classList.remove('active'); },
        sendChat(btn) {
          const msg = btn.dataset.message;
          App.showToast(App.user.username + ': ' + msg);
          document.getElementById('chat-panel').classList.remove('active');
        },
        showRules() {
          App.showModal('📋 Правила', '• Ходите по очереди
• 15 сек на ход
• 3 в ряд = победа
• Ничья = возврат ставок');
        },
        deposit() { App.showToast('Пополнение скоро будет доступно'); App.closeModal(); },
        closeModal() { App.closeModal(); },
        requestRevenge() { App.showToast('Реванш запрошен!'); App.navigate('stake'); }
      },

      screenEvents: {},

      showToast(msg, type) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast ' + (type || 'info') + ' show';
        setTimeout(() => toast.classList.remove('show'), 3000);
      },

      showModal(title, text, buttons) {
        const container = document.getElementById('modals');
        const modalId = 'modal-' + Date.now();
        const btnHtml = (buttons || []).map(function(b, i) {
          return '<button class="btn ' + (b.danger ? 'btn-danger' : i === 0 ? 'btn-secondary' : 'btn-primary') + '" style="flex:1;justify-content:center;" data-modal-action="' + b.action + '" ' + (b.target ? 'data-target="' + b.target + '"' : '') + '>' + b.text + '</button>';
        }).join('');
        container.innerHTML = '<div class="modal-overlay active" id="' + modalId + '"><div class="modal-box"><div style="font-size:18px;font-weight:700;margin-bottom:8px;">' + title + '</div><div style="color:var(--text-secondary);font-size:14px;margin-bottom:20px;line-height:1.5;">' + text.replace(/
/g, '<br>') + '</div><div style="display:flex;gap:10px;">' + btnHtml + '</div></div></div>';
        container.querySelectorAll('[data-modal-action]').forEach(btn => {
          btn.onclick = () => {
            const action = btn.dataset.modalAction;
            if (action === 'close') { document.getElementById(modalId)?.remove(); }
            else if (action === 'navigate') { document.getElementById(modalId)?.remove(); App.navigate(btn.dataset.target); }
            else if (App.actions[action]) { App.actions[action](); }
          };
        });
      },

      closeModal() { document.querySelector('.modal-overlay')?.remove(); }
    };

    // ===== SCREEN 1: SPLASH =====
    App.register('splash', function() {
      return '<div class="flex flex-col items-center justify-center" style="height:100%;padding:24px;text-align:center;"><div style="display:grid;grid-template-columns:repeat(3,48px);gap:8px;margin-bottom:24px;">' + ['O','X','O','X','O','X','O','X',''].map(function(c) {
        return '<div style="width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;background:' + (c==='X'?'rgba(42,171,238,0.2)':c==='O'?'rgba(255,59,48,0.2)':'var(--card)') + ';color:' + (c==='X'?'var(--accent)':c==='O'?'var(--danger)':'transparent') + ';">' + c + '</div>';
      }).join('') + '</div><h1 style="font-size:32px;font-weight:800;margin-bottom:8px;">TicTacBet</h1><p style="color:var(--text-secondary);margin-bottom:48px;">PvP Crypto Battles</p><button class="btn btn-primary btn-large" data-action="login" style="margin-bottom:32px;">Войти через Telegram</button><div style="display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;">' + [['🛡','Skill-based PvP'],['⚡','Мгновенные выплаты'],['💰','Ставки от $0.5']].map(function(item) {
        return '<div style="display:flex;align-items:center;gap:12px;color:var(--text-secondary);font-size:14px;"><div style="width:32px;height:32px;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px;">' + item[0] + '</div><span>' + item[1] + '</span></div>';
      }).join('') + '</div></div>';
    });

    // ===== SCREEN 2: DASHBOARD =====
    App.register('dashboard', function() {
      var username = App.user ? App.user.username : 'user';
      var initial = username ? username[0].toUpperCase() : 'U';
      return '<div style="display:flex;flex-direction:column;height:100%;"><div style="padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.05);"><div style="display:flex;align-items:center;gap:10px;"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1E90FF);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;">' + initial + '</div><span style="font-size:15px;font-weight:600;">@' + username + '</span></div><button class="btn btn-ghost" style="width:36px;height:36px;padding:0;border-radius:10px;background:var(--card);">⚙️</button></div><div style="padding:16px;display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:28px;font-weight:700;">10.00 TON</div><div style="font-size:14px;color:var(--text-secondary);">~$42.00</div></div><button class="btn btn-primary" style="padding:10px 20px;background:rgba(42,171,238,0.15);color:var(--accent);border:1px solid rgba(42,171,238,0.3);font-size:14px;" data-action="deposit">+ Пополнить</button></div><div class="scrollable"><div style="background:linear-gradient(135deg,#FF6B35,#F7931E);border-radius:16px;padding:20px;margin-bottom:20px;"><div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:0.9;margin-bottom:8px;">🔥 Freeroll</div><div style="font-size:24px;font-weight:700;margin-bottom:8px;">02:00:00</div><div style="font-size:14px;opacity:0.9;margin-bottom:16px;">Приз: 50 TON</div><button class="btn" style="width:100%;padding:12px;background:white;color:#FF6B35;border:none;border-radius:10px;font-size:15px;font-weight:700;">Участвовать</button></div><button class="btn btn-primary btn-large" data-action="navigate" data-target="stake" style="margin-bottom:20px;box-shadow:0 8px 32px rgba(42,171,238,0.3);"><span>🔥</span><span>Играть PvP</span></button><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">' + [['🎮','Игр','0'],['🏆','Побед','0'],['📊','Винрейт','0%'],['🔥','Стрик','0']].map(function(item) {
        return '<div style="background:var(--card);border-radius:12px;padding:16px;text-align:center;"><div style="font-size:24px;margin-bottom:8px;">' + item[0] + '</div><div style="font-size:22px;font-weight:700;margin-bottom:4px;">' + item[2] + '</div><div style="font-size:12px;color:var(--text-secondary);">' + item[1] + '</div></div>';
      }).join('') + '</div><div style="text-align:center;padding:12px;color:var(--text-secondary);font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px;"><div style="width:8px;height:8px;background:var(--success);border-radius:50%;animation:pulse 2s infinite;"></div><span>Онлайн: <strong>1</strong></span></div></div><div style="position:fixed;bottom:0;left:0;right:0;background:rgba(15,15,15,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.05);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));">' + [['🏠','Главная','dashboard',true],['🎮','Играть','stake',false],['👤','Профиль','profile',false]].map(function(item) {
        return '<button class="btn btn-ghost" style="flex:1;flex-direction:column;gap:4px;padding:8px;font-size:11px;color:' + (item[3]?'var(--accent)':'var(--text-secondary)') + ';" data-action="navigate" data-target="' + item[2] + '"><span style="font-size:24px;line-height:1;">' + item[0] + '</span><span>' + item[1] + '</span></button>';
      }).join('') + '</div></div>';
    });

    // ===== SCREEN 3: STAKE SELECT =====
    App.register('stake', function() {
      var stakes = [{ton:0.5,usd:2.1,p:false},{ton:1,usd:4.2,p:true},{ton:2,usd:8.4,p:false},{ton:5,usd:21,p:false}];
      return '<div style="display:flex;flex-direction:column;height:100%;"><div style="padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.05);"><button class="btn btn-secondary" style="width:36px;height:36px;padding:0;" data-action="navigate" data-target="dashboard">←</button><span style="font-size:17px;font-weight:600;">Выбор ставки</span></div><div class="scrollable" style="padding-top:20px;"><h2 style="font-size:22px;font-weight:700;margin-bottom:20px;text-align:center;">Выберите размер ставки</h2><div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px;">' + stakes.map(function(s) {
        return '<div class="stake-card" data-stake="' + s.ton + '" data-action="selectStake" style="background:var(--card);border-radius:16px;padding:20px;display:flex;justify-content:space-between;align-items:center;border:2px solid transparent;cursor:pointer;transition:all 0.15s;"><div><h3 style="font-size:20px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;">💎 ' + s.ton + ' TON ' + (s.p ? '<span style="background:linear-gradient(135deg,#FF6B35,#F7931E);color:white;font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;text-transform:uppercase;">🔥 Популярно</span>' : '') + '</h3><div style="font-size:14px;color:var(--text-secondary);">~$' + s.usd.toFixed(2) + '</div></div><span class="btn btn-primary" style="padding:10px 20px;font-size:14px;white-space:nowrap;pointer-events:none;">Выбрать</span></div>';
      }).join('') + '</div><div style="background:var(--card);border-radius:12px;padding:16px;"><div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);"><span style="color:var(--text-secondary);font-size:14px;">💰 Ваш баланс</span><span style="font-weight:600;font-size:14px;">10.00 TON</span></div><div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);"><span style="color:var(--text-secondary);font-size:14px;">💡 Комиссия</span><span style="font-weight:600;font-size:14px;">5%</span></div><div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);"><span style="color:var(--text-secondary);font-size:14px;">💡 Победитель</span><span style="font-weight:600;font-size:14px;color:var(--accent);">95% банка</span></div><div style="display:flex;justify-content:space-between;padding:10px 0;"><span style="color:var(--text-secondary);font-size:14px;">⏱ Время на ход</span><span style="font-weight:600;font-size:14px;">15 сек</span></div></div></div></div>';
    });

    // ===== SCREEN 4: QUEUE =====
    App.register('queue', function(params) {
      return '<div style="display:flex;flex-direction:column;height:100%;position:relative;"><button class="btn btn-secondary" style="position:absolute;top:16px;left:16px;width:40px;height:40px;padding:0;z-index:10;" data-action="cancelQueue">←</button><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;"><div style="width:200px;height:200px;position:relative;margin-bottom:40px;"><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1E90FF);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 40px rgba(42,171,238,0.4);z-index:2;">🔍</div><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120px;height:120px;border:2px solid rgba(42,171,238,0.2);border-radius:50%;animation:orbit-spin 3s linear infinite;"><div style="position:absolute;width:12px;height:12px;background:var(--accent);border-radius:50%;top:-6px;left:50%;transform:translateX(-50%);box-shadow:0 0 12px var(--accent);"></div></div><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:180px;border:2px solid rgba(42,171,238,0.1);border-radius:50%;animation:orbit-spin 5s linear infinite reverse;"><div style="position:absolute;width:10px;height:10px;background:var(--accent);border-radius:50%;top:-5px;left:50%;transform:translateX(-50%);"></div></div></div><div style="text-align:center;margin-bottom:32px;"><div style="font-size:22px;font-weight:700;margin-bottom:8px;">Поиск соперника...</div><div style="color:var(--text-secondary);font-size:15px;">Ожидаем подходящего игрока</div><div style="display:inline-flex;align-items:center;gap:6px;background:rgba(42,171,238,0.15);color:var(--accent);padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;margin-top:12px;">💎 ' + params.stake + ' TON</div></div><div style="display:flex;gap:24px;margin-bottom:40px;"><div style="text-align:center;"><div style="font-size:20px;font-weight:700;color:var(--accent);" id="queueTimer">00:00</div><div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Ожидание</div></div><div style="text-align:center;"><div style="font-size:20px;font-weight:700;color:var(--accent);">1</div><div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Онлайн</div></div><div style="text-align:center;"><div style="font-size:20px;font-weight:700;color:var(--accent);">0</div><div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">В очереди</div></div></div><button class="btn btn-danger" data-action="cancelQueue" style="width:100%;max-width:280px;padding:16px 24px;border-radius:14px;font-size:16px;"><span>❌</span><span>Отменить поиск</span></button></div></div>';
    });

    // ===== SCREEN 5: GAME =====
    App.register('game', function(params) {
      var username = App.user ? App.user.username : 'user';
      var initial = username ? username[0].toUpperCase() : 'U';
      var oppName = params.opponent && params.opponent.username ? params.opponent.username : 'Bot';
      var oppInitial = oppName ? oppName[0].toUpperCase() : 'B';
      var cells = '';
      for (var i = 0; i < 9; i++) {
        cells += '<div class="game-cell" data-index="' + i + '" data-action="makeMove"></div>';
      }
      return '<div style="display:flex;flex-direction:column;height:100%;" id="gameScreen"><div style="padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.05);"><button class="btn btn-danger" style="padding:8px 14px;font-size:13px;" data-action="surrender">🏳️ Сдаться</button><div style="text-align:center;"><div style="font-size:12px;color:var(--text-secondary);">Раунд 1/1</div><div style="font-size:14px;font-weight:700;color:var(--accent);">💎 ' + params.stake + ' TON</div></div><div style="width:80px;"></div></div><div style="padding:16px;display:flex;align-items:center;justify-content:space-between;"><div id="myCard" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;transition:all 0.3s;background:rgba(42,171,238,0.15);box-shadow:0 0 20px rgba(42,171,238,0.2);"><div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1E90FF);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;">' + initial + '</div><div style="display:flex;flex-direction:column;"><span style="font-size:14px;font-weight:600;">@' + username + '</span><span style="font-size:12px;color:var(--text-secondary);">Вы играете X</span></div></div><div style="font-size:14px;font-weight:900;color:var(--text-secondary);">VS</div><div id="oppCard" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;transition:all 0.3s;"><div style="display:flex;flex-direction:column;align-items:flex-end;"><span style="font-size:14px;font-weight:600;">@' + oppName + '</span><span style="font-size:12px;color:var(--text-secondary);">Играет O</span></div><div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--danger),#E6352B);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;">' + oppInitial + '</div></div></div><div style="text-align:center;padding:8px;"><div id="turnText" style="font-size:14px;font-weight:600;margin-bottom:8px;color:var(--accent);">Ваш ход! (15)</div><div style="width:200px;height:4px;background:var(--card);border-radius:2px;margin:0 auto;overflow:hidden;"><div id="timerFill" style="height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#1E90FF);border-radius:2px;transition:width 1s linear;"></div></div></div><div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px;"><div id="gameBoard" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:320px;aspect-ratio:1;">' + cells + '</div></div><div style="padding:16px;border-top:1px solid rgba(255,255,255,0.05);"><div style="text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:12px;">Банк: <span style="color:var(--accent);font-weight:600;">' + (params.stake * 1.9).toFixed(2) + ' TON</span></div><div style="display:flex;gap:10px;justify-content:center;"><button class="btn btn-secondary" style="padding:10px 18px;font-size:13px;" data-action="toggleChat">💬 Чат</button><button class="btn btn-secondary" style="padding:10px 18px;font-size:13px;" data-action="showRules">📋 Правила</button></div></div><div id="chat-panel" style="position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;padding:16px;transform:translateY(100%);transition:transform 0.3s;z-index:50;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><span style="font-weight:600;">💬 Быстрые фразы</span><button data-action="closeChat" style="background:none;border:none;color:var(--text-secondary);font-size:20px;cursor:pointer;">✕</button></div><div style="max-height:200px;overflow-y:auto;">' + ['Удачи! 🍀','Хороший ход! 👍','Ой... 😅','Давай! 💪','😎','😂','👏'].map(function(msg) {
        return '<div data-action="sendChat" data-message="' + msg + '" style="padding:8px 14px;background:rgba(255,255,255,0.05);border-radius:12px;margin-bottom:8px;font-size:14px;cursor:pointer;">' + msg + '</div>';
      }).join('') + '</div></div></div>';
    });

    App.screenEvents.game = function(container, params) {
      var board = [null,null,null,null,null,null,null,null,null];
      var mySymbol = 'X', currentTurn = 'X', timeLeft = 15, timerInterval = null, gameEnded = false;
      var cells = container.querySelectorAll('.game-cell');
      var turnText = container.querySelector('#turnText');
      var timerFill = container.querySelector('#timerFill');
      var myCard = container.querySelector('#myCard');
      var oppCard = container.querySelector('#oppCard');

      var botMove = function() {
        if (gameEnded || currentTurn === mySymbol) return;
        var empty = [];
        for (var i = 0; i < 9; i++) { if (board[i] === null) empty.push(i); }
        if (empty.length === 0) return;
        var idx = empty[Math.floor(Math.random() * empty.length)];
        setTimeout(function() {
          if (gameEnded) return;
          board[idx] = 'O';
          cells[idx].textContent = 'O';
          cells[idx].classList.add('taken', 'o');
          currentTurn = 'X';
          turnText.textContent = 'Ваш ход! (15)';
          turnText.style.color = 'var(--accent)';
          myCard.style.cssText += 'background:rgba(42,171,238,0.15);box-shadow:0 0 20px rgba(42,171,238,0.2);';
          oppCard.style.cssText = oppCard.style.cssText.replace(/background[^;]+;?/,'').replace(/box-shadow[^;]+;?/,'');
          timerFill.style.width = '100%';
          timerFill.style.background = 'linear-gradient(90deg,var(--accent),#1E90FF)';
          checkWin();
        }, 1000);
      };

      var checkWin = function() {
        var patterns = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for (var p = 0; p < patterns.length; p++) {
          var a = patterns[p][0], b = patterns[p][1], c = patterns[p][2];
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            gameEnded = true;
            cells[a].style.background = 'rgba(52,199,89,0.2)'; cells[a].style.borderColor = 'var(--success)';
            cells[b].style.background = 'rgba(52,199,89,0.2)'; cells[b].style.borderColor = 'var(--success)';
            cells[c].style.background = 'rgba(52,199,89,0.2)'; cells[c].style.borderColor = 'var(--success)';
            var isWin = board[a] === 'X';
            setTimeout(function() { App.navigate('result', { result: isWin ? 'win' : 'lose', amount: isWin ? params.stake * 1.9 : 0, stake: params.stake, board: board, winningCells: [a,b,c] }); }, 1500);
            return;
          }
        }
        var hasEmpty = false;
        for (var i = 0; i < 9; i++) { if (board[i] === null) hasEmpty = true; }
        if (!hasEmpty) {
          gameEnded = true;
          setTimeout(function() { App.navigate('result', { result: 'draw', amount: 0, stake: params.stake, board: board }); }, 500);
        }
      };

      App.game = {
        makeMove: function(index) {
          if (gameEnded || board[index] || currentTurn !== mySymbol) return;
          board[index] = mySymbol;
          cells[index].textContent = mySymbol;
          cells[index].classList.add('taken', mySymbol.toLowerCase());
          currentTurn = 'O';
          turnText.textContent = 'Ход соперника...';
          turnText.style.color = 'var(--text-secondary)';
          myCard.style.cssText = myCard.style.cssText.replace(/background[^;]+;?/,'').replace(/box-shadow[^;]+;?/,'');
          oppCard.style.cssText += 'background:rgba(255,59,48,0.15);box-shadow:0 0 20px rgba(255,59,48,0.2);';
          timerFill.style.width = '0%';
          checkWin();
          if (!gameEnded) botMove();
        },
        surrender: function() { gameEnded = true; App.navigate('result', { result: 'lose', amount: 0, stake: params.stake, board: board }); },
        sendChat: function(msg) { App.showToast(App.user.username + ': ' + msg); }
      };

      timerFill.style.width = '100%';
    };

    // ===== SCREEN 6: RESULT =====
    App.register('result', function(params) {
      var isWin = params.result === 'win', isDraw = params.result === 'draw';
      var amount = params.amount || 0;
      var boardHtml = '';
      for (var i = 0; i < 9; i++) {
        var cell = params.board ? params.board[i] : null;
        var style = 'background:var(--card);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;';
        if (cell === 'X') style += 'color:var(--accent);';
        else if (cell === 'O') style += 'color:var(--danger);';
        if (params.winningCells && params.winningCells.indexOf(i) !== -1) style += 'background:rgba(52,199,89,0.2);border:2px solid var(--success);';
        boardHtml += '<div style="' + style + '">' + (cell || '') + '</div>';
      }
      return '<div style="min-height:100vh;position:relative;">' + (isWin ? '<div id="confetti-container" style="position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;"></div>' : '') + '<div style="padding:16px;display:flex;justify-content:space-between;align-items:center;"><button class="btn btn-secondary" style="padding:8px 14px;font-size:13px;" data-action="share"><span>📤</span><span>Поделиться</span></button><button class="btn btn-secondary" style="padding:8px 14px;font-size:13px;" data-action="navigate" data-target="profile"><span>📊</span><span>История</span></button></div><div style="text-align:center;padding:20px 24px;position:relative;"><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;border-radius:50%;filter:blur(80px);opacity:0.3;animation:glowPulse 3s ease infinite;background:' + (isWin?'var(--success)':isDraw?'var(--warning)':'var(--danger)') + ';"></div><div style="font-size:80px;margin-bottom:16px;display:inline-block;animation:emojiBounce 0.6s ease;">' + (isWin?'🎉':isDraw?'🤝':'😔') + '</div><h1 style="font-size:36px;font-weight:800;margin-bottom:8px;letter-spacing:-0.5px;">' + (isWin?'ПОБЕДА!':isDraw?'НИЧЬЯ':'ПОРАЖЕНИЕ') + '</h1><div style="font-size:42px;font-weight:700;margin-bottom:8px;animation:amountSlide 0.5s ease 0.3s both;color:' + (isWin?'var(--success)':isDraw?'var(--warning)':'var(--danger)') + ';">' + (isWin?'+':isDraw?'±':'-') + amount.toFixed(2) + ' TON</div><div style="font-size:16px;color:var(--text-secondary);animation:amountSlide 0.5s ease 0.4s both;">~$' + (amount * 4.2).toFixed(2) + '</div></div><div style="padding:0 24px 24px;"><div style="text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:12px;">Игровое поле</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto;aspect-ratio:1;">' + boardHtml + '</div></div><div style="padding:0 24px 24px;"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;"><div style="background:var(--card);border-radius:12px;padding:14px;text-align:center;"><div style="font-size:20px;font-weight:700;margin-bottom:4px;">1:24</div><div style="font-size:11px;color:var(--text-secondary);">Длительность</div></div><div style="background:var(--card);border-radius:12px;padding:14px;text-align:center;"><div style="font-size:20px;font-weight:700;margin-bottom:4px;">' + (params.board ? params.board.filter(Boolean).length : 0) + '</div><div style="font-size:11px;color:var(--text-secondary);">Ходов</div></div><div style="background:var(--card);border-radius:12px;padding:14px;text-align:center;"><div style="font-size:20px;font-weight:700;margin-bottom:4px;">' + (isWin?'+95%':isDraw?'0%':'-100%') + '</div><div style="font-size:11px;color:var(--text-secondary);">Доход</div></div></div></div><div style="padding:0 24px 32px;display:flex;flex-direction:column;gap:10px;">' + (isWin ? '<button class="btn btn-primary btn-large" style="background:linear-gradient(135deg,var(--success),#30B350);box-shadow:0 4px 20px rgba(52,199,89,0.3);" data-action="requestRevenge"><span>⚔️</span><span>Реванш</span></button>' : '') + '<button class="btn btn-primary btn-large" data-action="navigate" data-target="stake"><span>🔄</span><span>Играть ещё</span></button><button class="btn btn-secondary btn-large" data-action="navigate" data-target="dashboard"><span>🏠</span><span>В меню</span></button></div></div>';
    });

    App.screenEvents.result = function(container, params) {
      if (params.result === 'win') {
        var confettiContainer = container.querySelector('#confetti-container');
        var colors = ['#2AABEE', '#34C759', '#FFCC00', '#FF3B30', '#FF6B35'];
        for (var i = 0; i < 50; i++) {
          var confetti = document.createElement('div');
          confetti.style.cssText = 'position:absolute;width:' + (Math.random()*10+5) + 'px;height:' + (Math.random()*10+5) + 'px;background:' + colors[Math.floor(Math.random()*colors.length)] + ';left:' + Math.random()*100 + '%;top:-10px;border-radius:' + (Math.random()>0.5?'50%':'0') + ';animation:confettiFall ' + (Math.random()*2+2) + 's linear ' + Math.random()*2 + 's forwards;';
          confettiContainer.appendChild(confetti);
        }
        setTimeout(function() { confettiContainer.innerHTML = ''; }, 5000);
      }
    };

    // ===== PROFILE SCREEN =====
    App.register('profile', function() {
      var username = App.user ? App.user.username : 'user';
      var initial = username ? username[0].toUpperCase() : 'U';
      return '<div style="display:flex;flex-direction:column;height:100%;padding:24px;"><div style="text-align:center;margin-bottom:32px;"><div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#1E90FF);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px;margin:0 auto 16px;">' + initial + '</div><h1 style="font-size:24px;font-weight:700;margin-bottom:8px;">@' + username + '</h1><div style="color:var(--text-secondary);font-size:14px;">ID: ' + (App.user ? App.user.id : '—') + '</div></div><div style="background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;"><div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05);"><span style="color:var(--text-secondary);">Баланс</span><span style="font-weight:600;">10.00 TON</span></div><div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05);"><span style="color:var(--text-secondary);">Игр сыграно</span><span style="font-weight:600;">0</span></div><div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05);"><span style="color:var(--text-secondary);">Побед</span><span style="font-weight:600;">0</span></div><div style="display:flex;justify-content:space-between;padding:12px 0;"><span style="color:var(--text-secondary);">Винрейт</span><span style="font-weight:600;">0%</span></div></div><button class="btn btn-primary btn-large" data-action="navigate" data-target="dashboard">🏠 В меню</button></div>';
    });

    // ===== INIT =====
    window.addEventListener('DOMContentLoaded', function() { App.init(); });
  </script>
</body>
</html>
